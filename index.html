<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>oftenback.io</title>
<style>
  /* the desktop Nakata Environment "nuage": cream ground, barely-visible
     dithered clouds drifting on a slow wind, inside a uniform padding all
     around (port of bin/co-lab-cloud-saver.py + bin/render-clouds.py). */
  :root { --ground:#f4ede2; --pad:44px; --mark:#ff6a00; }  /* oftenback.io: bright fluorescent orange */
  html, body { margin:0; height:100%; background:var(--ground); overflow:hidden; }
  #c {
    position:fixed; left:var(--pad); top:var(--pad);
    width:calc(100vw - 2*var(--pad)); height:calc(100vh - 2*var(--pad));
    display:block;
  }
  /* oftenback.io, a whisper under the lower-left corner (nothing shouts) */
  #mark {
    position:fixed; left:var(--pad); bottom:14px;
    font:700 12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif;
    letter-spacing:0.42em; text-transform:lowercase;
    color:var(--mark); user-select:none; pointer-events:none;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="mark">oftenback.io</div>
<script>
(function () {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // cloud tint = ground * 0.40; a 1-on/1-off dither, periodic in x so it wraps
  // seamlessly as it drifts. Same knobs as bin/render-clouds.py.
  const GROUND = [244, 237, 226], DARKEN = 0.40, THRESH = 0.28, MAXA = 170;
  const cr = Math.round(GROUND[0] * DARKEN),
        cg = Math.round(GROUND[1] * DARKEN),
        cb = Math.round(GROUND[2] * DARKEN);
  const inv = 1 / (1 - THRESH), TAU = 2 * Math.PI;
  let tex = null, tw = 0, th = 0;

  function build(w, h) {
    tw = Math.max(1, w | 0); th = Math.max(1, h | 0);
    const sx1 = new Float32Array(tw), sx2 = new Float32Array(tw), sx3 = new Float32Array(tw);
    for (let x = 0; x < tw; x++) {
      sx1[x] = Math.sin(TAU * x / tw);
      sx2[x] = Math.sin(2 * TAU * x / tw + 2.0);
      sx3[x] = Math.sin(3 * TAU * x / tw + 4.0);
    }
    const off = document.createElement('canvas');
    off.width = tw; off.height = th;
    const octx = off.getContext('2d');
    const img = octx.createImageData(tw, th), d = img.data;
    for (let y = 0; y < th; y++) {
      const c1 = Math.cos(1.3 * TAU * y / th + 1.1),
            c2 = Math.cos(0.7 * TAU * y / th + 0.3),
            c3 = Math.cos(1.8 * TAU * y / th + 2.5),
            ybit = y & 1;
      for (let x = 0; x < tw; x++) {
        if ((x & 1) === ybit) {
          let v = 0.55 * sx1[x] * c1 + 0.30 * sx2[x] * c2 + 0.20 * sx3[x] + 0.20 * c3;
          v = 0.5 + 0.5 * (v > 1 ? 1 : v < -1 ? -1 : v);
          if (v > THRESH) {
            const a = (MAXA * (v - THRESH) * inv) | 0;
            if (a) { const i = (y * tw + x) * 4; d[i] = cr; d[i+1] = cg; d[i+2] = cb; d[i+3] = a; }
          }
        }
      }
    }
    octx.putImageData(img, 0, 0);
    tex = off;
  }

  function resize() {
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w; cv.height = h;
    build(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  // slow wind: 1 px / 120 ms in the saver -> ~8.3 px/s
  const SPEED = 1000 / 120;
  let off = 0, last = performance.now();
  function frame(now) {
    const dt = (now - last) / 1000; last = now;
    off = (off + SPEED * dt) % tw;
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (tex) {
      const o = Math.floor(off);
      ctx.drawImage(tex, o, 0, tw - o, th, 0, 0, tw - o, th);
      if (o > 0) ctx.drawImage(tex, 0, 0, o, th, tw - o, 0, o, th);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
