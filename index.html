<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oftenback</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #E8D9BD; }
  #stage { display: block; width: 100vw; height: 100vh; }
  .brand {
    position: fixed; left: 28px; top: 20px; z-index: 2; pointer-events: none;
    display: flex; align-items: center; gap: 12px;
  }
  .brand .logo { width: 46px; height: 46px; display: block; }
  .brand .mark {
    font: 500 18px/1 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .14em; text-transform: lowercase; color: #3D3530; opacity: .72;
  }
  .tag {
    position: fixed; left: 30px; bottom: 24px; pointer-events: none; z-index: 2;
    font: 400 12px/1.5 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .04em; color: #8E7F73;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="brand">
  <img class="logo" src="face.svg" alt="oftenback">
  <span class="mark">oftenback</span>
</div>
<div class="tag" id="tag"></div>

<script>
"use strict";

/* ─────────────────────────────────────────────────────────────
   oftenback landing — Co/Lab floating-shapes composition.
   A homage to the Tab5 home display: the same forms, no data.
   - Each cluster of shapes drifts as an island, bouncing off the
     screen (inset by SCREEN_PAD) and off other clusters (CLUSTER_GAP),
     never overlapping.
   - Within a cluster, every shape also wanders on a light wind and
     leans toward the cursor's gravity.
   Tunable knobs are grouped just below.
   ───────────────────────────────────────────────────────────── */

// ── Co/Lab palette (from tab5-v4 Layout.h, substrate-validated 2026-05-29) ──
const PAL = {
  BG:"#E8D9BD", CARD:"#D8CAB0", BORDER:"#C4B79D", INK:"#3D3530",
  DIM:"#8E7F73", SAGE:"#9AAB97", AMBER:"#C89A5E", CLAY:"#A55A4A",
};

// ── Motion + interaction knobs ──
const VW = 1280, VH = 720;        // virtual composition space (Tab5 native)
const FLOAT_AMP    = 7;           // px of idle per-shape drift (virtual units)
const FLOAT_SPEED  = 0.55;        // drift tempo
const GRAV_R       = 300;         // cursor influence radius (virtual units)
const GRAV_MAX     = 55;          // strongest pull toward cursor (virtual units)
const GRAV_FALLOFF = 1.5;         // >1 = pull concentrates near the cursor
const EASE         = 0.075;       // per-shape position smoothing
const PROX_TINT    = 0.45;        // how far a near shape warms toward AMBER (0..1)
const SHADOW       = 0.10;        // soft drop-shadow alpha
const SCREEN_PAD   = 20;          // invisible inset clusters bounce off (virtual px)
const CLUSTER_GAP  = 20;          // invisible gap kept between clusters (virtual px)
const CLUSTER_SPEED= 24;          // base cluster drift speed (virtual units / sec)

const reduced  = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const floatAmp = reduced ? FLOAT_AMP * 0.25 : FLOAT_AMP;
const gravMax  = reduced ? GRAV_MAX  * 0.4  : GRAV_MAX;
const cluSpeed = reduced ? 0 : CLUSTER_SPEED;   // reduced motion -> islands hold still

// ── Color helpers ──
function hexToRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function lerpRgb(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function css(rgb){ return `rgb(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0})`; }
const AMBER_RGB = hexToRgb(PAL.AMBER), SAGE_RGB = hexToRgb(PAL.SAGE);

/* ── Shapes, in virtual 1280x720 coords (mirrors Tab5 Layout) ──
   type: "disc" (r) | "stone" (w,h pebble) | "dot" (r, drawn on top)        */
const SHAPES = [
  { id:"w1", type:"disc",  x:185, y:215, r:78, fill:PAL.CARD },
  { id:"w2", type:"disc",  x:305, y:335, r:52, fill:PAL.SAGE },

  { id:"yardL", type:"stone", x:512, y:300, w:82,  h:128, fill:PAL.BORDER },
  { id:"house", type:"stone", x:640, y:300, w:172, h:150, fill:PAL.CARD   },
  { id:"yardB", type:"stone", x:772, y:292, w:112, h:112, fill:PAL.BORDER },
  { id:"pool",  type:"dot",   x:780, y:296, r:26, fill:PAL.SAGE },
  { id:"yardF", type:"stone", x:640, y:444, w:150, h:70,  fill:PAL.BORDER },

  { id:"cam",   type:"stone", x:640, y:566, w:172, h:86,  fill:PAL.CARD },

  { id:"m1", type:"disc", x:968,  y:250, r:46, fill:PAL.CARD   },
  { id:"m2", type:"disc", x:1055, y:276, r:38, fill:PAL.BORDER },
  { id:"m3", type:"disc", x:1140, y:256, r:42, fill:PAL.CARD   },

  { id:"pd",  type:"disc", x:1150, y:600, r:52, fill:PAL.SAGE },
  { id:"net", type:"dot",  x:1150, y:118, r:10, fill:PAL.SAGE, pulse:true },
];

// soft connectors drawn under the shapes (each links shapes in one cluster)
const LINKS = [ ["w1","w2"], ["m1","m2"], ["m2","m3"], ["yardB","pool"] ];

// clusters = islands that drift + bounce as rigid units
const CLUSTERS = {
  weather: ["w1","w2"],
  house:   ["yardL","house","yardB","pool","yardF"],
  cameras: ["cam"],
  music:   ["m1","m2","m3"],
  pool:    ["pd"],
  net:     ["net"],
};

const byId = {}; SHAPES.forEach(s => byId[s.id] = s);

// deterministic PRNG so drift phases + headings are stable across reloads
let seed = 1337;
const rand = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

// per-shape drift state + current rendered position
SHAPES.forEach(s => {
  s.cx = s.x; s.cy = s.y;
  s.phx = rand()*Math.PI*2; s.phy = rand()*Math.PI*2;
  s.fx = 0.6 + rand()*0.7;  s.fy = 0.6 + rand()*0.7;
});

// build cluster objects: bbox centre, half-extents, member local offsets, heading
const clusters = [];
for (const [cid, members] of Object.entries(CLUSTERS)){
  let minX=1e9, minY=1e9, maxX=-1e9, maxY=-1e9;
  for (const id of members){
    const s = byId[id];
    const ex = s.type === "stone" ? s.w/2 : s.r;
    const ey = s.type === "stone" ? s.h/2 : s.r;
    minX = Math.min(minX, s.x-ex); maxX = Math.max(maxX, s.x+ex);
    minY = Math.min(minY, s.y-ey); maxY = Math.max(maxY, s.y+ey);
  }
  const cx0 = (minX+maxX)/2, cy0 = (minY+maxY)/2;
  const ang = rand()*Math.PI*2;
  const spd = cluSpeed * (0.7 + rand()*0.6);   // slight per-island speed variety
  const c = { id:cid, members, cx:cx0, cy:cy0, hw:(maxX-minX)/2, hh:(maxY-minY)/2,
              vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd };
  for (const id of members){ const s = byId[id]; s.lx = s.x-cx0; s.ly = s.y-cy0; s.cluster = c; }
  clusters.push(c);
}

// ── Cluster physics: drift, screen bounce, pairwise AABB bounce ──
function stepClusters(dt){
  for (const c of clusters){
    c.cx += c.vx*dt; c.cy += c.vy*dt;
    const minX = SCREEN_PAD + c.hw, maxX = VW - SCREEN_PAD - c.hw;
    const minY = SCREEN_PAD + c.hh, maxY = VH - SCREEN_PAD - c.hh;
    if (c.cx < minX){ c.cx = minX; c.vx =  Math.abs(c.vx); }
    else if (c.cx > maxX){ c.cx = maxX; c.vx = -Math.abs(c.vx); }
    if (c.cy < minY){ c.cy = minY; c.vy =  Math.abs(c.vy); }
    else if (c.cy > maxY){ c.cy = maxY; c.vy = -Math.abs(c.vy); }
  }
  for (let i=0; i<clusters.length; i++){
    for (let j=i+1; j<clusters.length; j++){
      const a = clusters[i], b = clusters[j];
      const ox = (a.hw + b.hw + CLUSTER_GAP) - Math.abs(a.cx - b.cx);
      const oy = (a.hh + b.hh + CLUSTER_GAP) - Math.abs(a.cy - b.cy);
      if (ox > 0 && oy > 0){                       // overlapping incl. gap
        if (ox < oy){                              // separate on the shallower axis
          const dir = a.cx < b.cx ? -1 : 1;
          a.cx += dir*ox/2; b.cx -= dir*ox/2;
          const t = a.vx; a.vx = b.vx; b.vx = t;   // equal-mass elastic swap
        } else {
          const dir = a.cy < b.cy ? -1 : 1;
          a.cy += dir*oy/2; b.cy -= dir*oy/2;
          const t = a.vy; a.vy = b.vy; b.vy = t;
        }
      }
    }
  }
}

// ── Canvas + scaling (contain the virtual space, centre it) ──
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = w*dpr; cv.height = h*dpr; cv.style.width = w+"px"; cv.style.height = h+"px";
  scale = Math.min(w/VW, h/VH);
  offX = (w - VW*scale)/2; offY = (h - VH*scale)/2;
}
window.addEventListener("resize", resize); resize();

// ── Pointer (screen -> virtual), inactive until the cursor enters ──
let mvx = 0, mvy = 0, active = false;
function setPointer(px, py){ mvx = (px - offX)/scale; mvy = (py - offY)/scale; active = true; }
window.addEventListener("mousemove", e => setPointer(e.clientX, e.clientY));
window.addEventListener("mouseleave", () => active = false);
window.addEventListener("touchmove", e => { const t=e.touches[0]; if(t) setPointer(t.clientX, t.clientY); }, {passive:true});
window.addEventListener("touchend", () => active = false);

// ── Time-of-day substrate tint (a subtle "condition") ──
function timeOfDay(){
  const h = new Date().getHours();
  if (h >= 5  && h < 8)  return { name:"dawn",  bg:[0xF0,0xE2,0xC6] };
  if (h >= 8  && h < 17) return { name:"day",   bg:hexToRgb(PAL.BG) };
  if (h >= 17 && h < 20) return { name:"dusk",  bg:[0xE6,0xCF,0xAC] };
  return                       { name:"night", bg:[0xD9,0xC9,0xAD] };
}
const tod = timeOfDay();
const BG_RGB = tod.bg;
document.getElementById("tag").textContent = tod.name;
document.body.style.background = css(BG_RGB);

// ── Drawing primitives ──
function roundRect(cx, cy, w, h, r){
  const x = cx - w/2, y = cy - h/2;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}
function shapeFill(s, prox, t){
  let base = hexToRgb(s.fill);
  if (s.pulse){ const b = Math.sin(t*1.6)*0.5 + 0.5; base = lerpRgb(SAGE_RGB, AMBER_RGB, b); }
  if (prox > 0) base = lerpRgb(base, AMBER_RGB, prox*PROX_TINT);
  return css(base);
}

// ── Frame ──
let t0 = null, lastTs = null;
function frame(ts){
  if (t0 === null){ t0 = ts; lastTs = ts; }
  const t = (ts - t0)/1000 * FLOAT_SPEED;
  let dt = (ts - lastTs)/1000; lastTs = ts; if (dt > 0.05) dt = 0.05;  // clamp tab-switch jumps

  stepClusters(dt);

  for (const s of SHAPES){
    const hx = s.cluster.cx + s.lx;           // cluster-driven home
    const hy = s.cluster.cy + s.ly;
    const dxF = Math.sin(t*s.fx + s.phx) * floatAmp;
    const dyF = Math.sin(t*s.fy + s.phy) * floatAmp;
    let tx = hx + dxF, ty = hy + dyF;
    s.prox = 0;
    if (active){
      const gx = mvx - tx, gy = mvy - ty;
      const d = Math.hypot(gx, gy);
      if (d < GRAV_R && d > 0.001){
        const f = Math.pow(1 - d/GRAV_R, GRAV_FALLOFF);
        s.prox = 1 - d/GRAV_R;
        tx += (gx/d) * f * gravMax;
        ty += (gy/d) * f * gravMax;
      }
    }
    s.cx += (tx - s.cx) * EASE;
    s.cy += (ty - s.cy) * EASE;
  }

  // render
  const W = cv.width, H = cv.height;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = css(BG_RGB); ctx.fillRect(0,0,W,H);
  ctx.setTransform(dpr*scale, 0, 0, dpr*scale, offX*dpr, offY*dpr);

  // connectors (under, no shadow)
  ctx.lineCap = "round";
  ctx.strokeStyle = css(hexToRgb(PAL.BORDER));
  ctx.globalAlpha = 0.55; ctx.lineWidth = 3.5;
  for (const [a,b] of LINKS){
    const A = byId[a], B = byId[b];
    ctx.beginPath(); ctx.moveTo(A.cx, A.cy); ctx.lineTo(B.cx, B.cy); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // shapes (soft lifted shadow), stones then discs then dots
  ctx.shadowColor = `rgba(61,53,48,${SHADOW})`;
  ctx.shadowBlur = 22; ctx.shadowOffsetY = 7;
  const order = { stone:0, disc:1, dot:2 };
  for (const s of [...SHAPES].sort((p,q)=>order[p.type]-order[q.type])){
    ctx.fillStyle = shapeFill(s, s.prox||0, t);
    if (s.type === "stone"){ roundRect(s.cx, s.cy, s.w, s.h, Math.min(s.w,s.h)*0.32); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(s.cx, s.cy, s.r, 0, Math.PI*2); ctx.fill(); }
  }
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
