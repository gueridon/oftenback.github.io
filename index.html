<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oftenback</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="site.css">
  <style>
    /* HOME IS THE MARK, AND THEN A GREETING.
       The sky with its cherry branch was here and is kept whole at
       index-sakura.html, unlinked. What stands here now is cream and almost
       nothing: the blob in the middle of the page with its name under it, and
       a moment later the welcome.

       THE BLOB DOES NOT TRAVEL ANY MORE. It used to hold the centre for two
       and a half seconds and then go, handing over to the small mark in the
       corner -- an overture, played once a session. It is not an overture
       now, it is the page: it arrives in the middle and it stays there, and
       the greeting comes to join it rather than replacing it.

       AND THERE IS NO ROOM LIST HERE AT ALL. It went in two steps and the
       second is the one that made sense of the first: the corner mark was a
       small copy of the mark already in the middle of the page and a way
       home from the page you are standing on, and once it was gone the list
       under it was hanging from nothing. What is left is one door, in the
       sentence, where someone arriving is already reading. site.js simply
       does not build the menu on this page. */
    .room-content{gap:clamp(34px,7vh,64px);}
    /* not a link here: you are already where it would take you */
    #mark{cursor:default;}
    #mark:hover{transform:none;}
    /* AFTER A BEAT, not with the page. The greeting waits for the mark to
       have been seen on its own, which is the whole of what the overture
       used to buy and all that is worth keeping of it. */
    #welcome{opacity:0;transition:opacity .9s ease;
      display:flex;flex-direction:column;align-items:center;gap:26px;}
    #welcome.in{opacity:1;}
    @media (prefers-reduced-motion:reduce){
      #welcome{transition:none;}
    }
    /* The one sentence on the site so far: hello, three times. The Japanese
       carries it and the two Latin words stand under it as glosses, which is
       the pattern the tea chapters settled on. */
    .hello{display:flex;flex-direction:column;align-items:center;gap:11px;}
    .hello .jp{font:400 clamp(26px,3.4vw,38px)/1 serif;letter-spacing:.34em;
      color:var(--ink);text-indent:.34em;}
    .hello .rom{display:flex;gap:26px;font-size:11px;letter-spacing:.36em;
      text-transform:lowercase;color:var(--dim);font-weight:600;}
    .hello .rom i{font-style:normal;}
    .note{max-width:400px;font-size:14px;line-height:1.95;font-weight:300;
      color:var(--dim);}
    /* THE ONLY DOOR ON THE PAGE, now that the room list has gone from it, so
       it is allowed to be one: the accent, and a rule under it that is there
       at rest rather than on hover. A link you have to find with the pointer
       is not a way in. */
    .note a{color:var(--clay);text-decoration:none;
      border-bottom:1px solid var(--clay);padding-bottom:1px;
      transition:color .35s ease,border-color .35s ease;}
    .note a:hover{color:var(--clay-deep);border-bottom-color:var(--clay-deep);}
    @media (max-width:760px){ .note{max-width:none;} }
  </style>
</head>
<body>
  <div id="veil"></div>
  <main class="room">
    <div class="room-content">
      <div class="center" id="mark">
        <canvas width="156" height="156" aria-hidden="true"></canvas>
        <span class="title">OFTENBACK</span>
      </div>
      <div id="welcome">
        <div class="hello">
          <span class="jp">ようこそ</span>
          <span class="rom"><i>welcome</i><i>bienvenue</i></span>
        </div>
        <p class="note">The personal website of Nicholas Bacuez, an ongoing
        project.<br><a href="chanoyu.html">Enter chanoyu</a>, the Japanese tea
        ceremony.</p>
      </div>
    </div>
  </main>

  <script src="blob.js"></script>
  <script src="site.js"></script>
  <script>
    // The mark in the middle is this page's own, not the menu's: site.js
    // draws the small one in the corner on every other page and leaves this
    // one alone.
    if (typeof startNakataBlob === "function") {
      startNakataBlob(document.querySelector("#mark canvas"));
    }
    // A SECOND, measured from when the page is shown rather than from when
    // its script parses: the veil is still over it at DOMContentLoaded and a
    // greeting that fades in behind a curtain has not appeared at all.
    addEventListener("load", () => {
      setTimeout(() => {
        const w = document.getElementById("welcome");
        if (w) w.classList.add("in");
      }, 1000);
    });
    // and the one door fades out like every other one on the site
    document.querySelectorAll(".note a").forEach((a) => {
      a.addEventListener("click", (ev) => {
        if (!window.__leaveTo) return;
        ev.preventDefault();
        window.__leaveTo(a.getAttribute("href"));
      });
    });
  </script>
</body>
</html>
