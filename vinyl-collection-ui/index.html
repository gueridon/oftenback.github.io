<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Collection - the wall</title>
<link rel="stylesheet" href="./nakata.css?v=4" />
<style>
  /* ---- the wall map: two shelves, drawn as the grids they physically are ---- */
  .wall{display:flex;flex-wrap:wrap;gap:34px;margin:6px 0 24px;align-items:flex-start;}
  /* Shelf 2 and the two loose places share a column to the right of Shelf 1, which is
     four rows tall against Shelf 2's two. The stack gap is 26px rather than 34px because
     each caption already carries 7px of margin above its grid, so the space you actually
     see between blocks matches the 34px used horizontally. */
  .stack{display:flex;flex-direction:column;gap:26px;}
  .pair{display:flex;gap:34px;}
  /* Names only. A caption is a flex item's widest child when it is longer than the grid
     below it, so it stretches the block and leaves dead space beside the cells: that is
     what the descriptions did to SHELF 1, TURNTABLE and OVERFLOW, and not to SHELF 2,
     whose four cells are wider than any caption. Keep these short. */
  .shelf .cap{font:600 11px var(--mono);color:var(--dim);text-transform:uppercase;
    letter-spacing:.07em;margin-bottom:7px;}
  .grid{display:grid;gap:5px;border:3px solid var(--border);border-radius:5px;padding:5px;
    background:var(--surface-light);}
  .cell{position:relative;width:104px;height:74px;border-radius:3px;background:var(--ground);
    border:1px solid var(--separator);cursor:pointer;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;}
  .cell:hover{border-color:var(--accent);}
  .cell.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
  .cell .num{font:700 13px var(--mono);color:var(--ink);}
  .cell.on .num{color:var(--accent);}
  .cell .num i{font:400 9px var(--mono);color:var(--dim);font-style:normal;}
  .cell .gen{font-size:9.5px;line-height:1.25;color:var(--muted);}
  .cell .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);opacity:.55;}
  .cell.res{background:repeating-linear-gradient(45deg,transparent,transparent 5px,
    rgba(142,127,115,.14) 5px,rgba(142,127,115,.14) 10px);cursor:default;}
  .cell.res .num{color:var(--dim);}
  .cell.res:hover{border-color:var(--separator);}
  .cell .pin{position:absolute;top:5px;right:6px;font:700 9px var(--mono);color:var(--accent);}

  /* ---- the selected cube, to scale ---- */
  .cube{position:relative;border:2px solid var(--separator);border-radius:6px;
    background:var(--surface-light);height:227px;display:flex;align-items:stretch;
    overflow:hidden;box-shadow:var(--float);}
  .spine{position:relative;border-right:1px solid rgba(61,53,48,.16);cursor:pointer;
    background:var(--surface);min-width:1px;}
  .spine:nth-child(even){background:var(--surface-hover);}
  .spine:hover,.spine.hit{background:var(--accent);}
  .spine .lab{position:absolute;inset:0;writing-mode:vertical-rl;text-orientation:mixed;
    font:600 9px var(--sans);color:var(--ink);padding:6px 0;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis;opacity:.85;}
  .spine:hover .lab,.spine.hit .lab{color:var(--on-accent);opacity:1;}
  .empty{flex:1;background:repeating-linear-gradient(45deg,transparent,transparent 6px,
    rgba(142,127,115,.13) 6px,rgba(142,127,115,.13) 12px);}
  .ruler{display:flex;justify-content:space-between;font:500 11px var(--mono);
    color:var(--dim);margin-top:10px;}
  .meta{margin:12px 0 4px;font-size:14px;color:var(--muted);}
  .meta b{color:var(--ink);} .warn{color:var(--accent);font-weight:600;}

  .panel{border:1px solid var(--separator);border-radius:var(--radius);padding:15px 17px;
    margin-top:20px;background:var(--ground);}
  .panel h3{margin:0 0 10px;font-size:15px;color:var(--ink);}
  .panel .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:9px;}
  .panel select{max-width:420px;}
  .panel .note{font-size:12.5px;color:var(--dim);line-height:1.55;margin-top:8px;}

  /* ---- the ordered list (what wall.html used to be) ---- */
  table.ord{border-collapse:collapse;width:100%;font-size:13px;margin-top:4px;}
  table.ord td{padding:3px 8px 3px 0;border-bottom:1px solid var(--separator);}
  table.ord td.i{color:var(--dim);font:600 11px var(--mono);width:1%;text-align:right;}
  table.ord td.mm{color:var(--dim);font:400 11px var(--mono);width:1%;text-align:right;padding-right:13px;}
  table.ord td.a{font-weight:600;color:var(--ink);white-space:nowrap;}
  table.ord td.t{color:var(--muted);} table.ord td.g{color:var(--dim);font-size:11px;white-space:nowrap;}
  table.ord tr.hit td{background:rgba(227,66,52,.10);}
  table.ord td.ck{width:1%;padding-right:10px;}
  table.ord td.ck input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;
    margin:0;vertical-align:middle;}
  table.ord tr.done td.a,table.ord tr.done td.t{color:var(--dim);text-decoration:line-through;
    text-decoration-thickness:1px;}
  table.ord tr.done td.i,table.ord tr.done td.mm,table.ord tr.done td.g{opacity:.5;}
  .prog{font:600 12px var(--mono);color:var(--dim);margin-left:8px;}
  .prog b{color:var(--accent);}
  .clr{font-size:12px;color:var(--dim);background:none;border:none;cursor:pointer;
    text-decoration:underline;padding:0;margin-left:12px;}
  /* Under the occupancy pin, top-right, not bottom-left: bottom-left sat on top of
     the genre label, which is the one thing on the cell you always want to read. */
  .cell .done{position:absolute;top:18px;right:6px;font:700 9px var(--mono);
    color:var(--accent);text-align:right;}
  .cell.alldone{background:rgba(45,226,104,.10);}
  .cell.ovf{background:repeating-linear-gradient(45deg,transparent,transparent 5px,
    rgba(227,66,52,.10) 5px,rgba(227,66,52,.10) 10px);}
  table.ord td.mv{width:1%;padding-left:4px;}
  table.ord td.mv button{font:600 10px var(--mono);color:var(--dim);background:none;
    border:1px solid var(--separator);border-radius:4px;padding:2px 6px;cursor:pointer;}
  table.ord td.mv button:hover{color:var(--on-accent);background:var(--accent);
    border-color:var(--accent);}
  .bulk{font-size:12px;color:var(--dim);background:none;border:none;cursor:pointer;
    text-decoration:underline;padding:0;margin-left:12px;}
  table.rec{border-collapse:collapse;width:100%;font-size:13px;}
  table.rec td{padding:4px 8px 4px 0;border-bottom:1px solid var(--separator);color:var(--ink-soft);}
  table.rec td.k{color:var(--dim);font:600 11px var(--mono);white-space:nowrap;}
  #found{margin:8px 0 14px;font-size:14px;}
  #found .where{color:var(--accent);font-weight:700;}
  @media print{ .wall{gap:20px} .cell{width:86px;height:64px} }
</style>
<script src="/oftenback-nav.js?v=4" defer></script>
</head>
<body>
  <div class="wrap">
    <div id="shell"></div>

    <div class="controls">
      <input id="q" type="search" placeholder="find a disc - artist, title, barcode…" />
      <span class="lbl">LP mm</span>
      <input id="lpmm" type="number" step="0.1" min="2" max="8" value="4.3" style="width:66px" />
      <span class="count" id="count"></span>
    </div>
    <div id="found"></div>

    <div class="wall" id="wall"></div>

    <div class="cube" id="cube"></div>
    <div class="ruler" id="ruler"><span>0 mm</span><span id="rmid"></span><span id="rmax">330 mm</span></div>
    <div class="meta" id="meta"></div>

    <div class="panel" id="detailpanel" hidden>
      <h3 id="detailtitle">Disc</h3><table class="rec" id="detail"></table>
    </div>

    <div class="panel">
      <h3>Ends of this cube</h3>
      <div class="row"><span class="lbl">first</span><select id="first"></select></div>
      <div class="row"><span class="lbl">last</span><select id="last"></select></div>
      <div class="row"><button id="save">save ends</button><span id="savemsg" class="lbl"></span></div>
      <div class="note" id="recmsg"></div>
    </div>

    <div class="panel">
      <h3 id="ordtitle">In order, left to right</h3>
      <div style="margin:-4px 0 8px"><span class="prog" id="prog"></span><button class="clr" id="clr">clear this cube</button><button class="bulk" id="bulkovf">move unticked to overflow</button></div>
      <table class="ord" id="ord"></table>
    </div>

    <footer>A collection kept by hand.</footer>
  </div>

<script type="module">
import { renderShell } from "./js/shell.js?v=4";
import { loadRecords, matchesQuery } from "./js/data.js?v=2";
import { saveRecords } from "./js/save.js?v=2";
import * as shelf from "./js/shelf.js?v=3";

renderShell("index.html");
let records = await loadRecords();
let cube = null, hitBarcode = null;
const el = id => document.getElementById(id);
const lpMm = () => parseFloat(el("lpmm").value) || shelf.LP_MM;
// Ticks live in localStorage, not in vinyl.json. This is progress through a physical
// job, not a fact about the record: it should not be published, should not sync to the
// scanner, and should cost nothing to change. The trade is that it is per-browser --
// tick on the phone at the shelf and the desk machine will not know.
const DONE_KEY = "nakata.vinyl.done";
const loadDone = () => { try { return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || "[]")); }
                         catch { return new Set(); } };
let done = loadDone();
const saveDone = () => localStorage.setItem(DONE_KEY, JSON.stringify([...done]));

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- the wall map -----------------------------------------------------------
// One place that decides how a location's genres are named, because this was written
// out three times and three copies of a rule always drift apart.
//
// The 10-inch stash is labelled by the tag the ordering uses rather than by the five
// unrelated genres those seven records happen to carry: genre is explicitly irrelevant
// for them, so listing it would be worse than saying nothing.
const genresOf = items =>
  [...new Set(items.map(i => i.record.format === shelf.TEN_INCH ? "10-inch" : i.record.genre))].sort();

// For a cell, which is 104px wide. Past three genres the list is clipped mid-word by
// overflow:hidden, and a truncated word reads as a rendering fault rather than as
// information, so it becomes a count. Only the overflow pile hits this today (8 genres);
// the fullest cube is 14, with exactly three.
const genresLabel = items => {
  const g = genresOf(items);
  return g.length > 3 ? `${g.length} genres` : g.join(", ");
};

function drawWall() {
  const shelfBlock = sh => {
    const cols = Math.max(...sh.rows.map(r => r.length));
    const cells = sh.rows.flat().map(c => {
      const reserved = shelf.RESERVED[c];
      if (reserved)
        return `<div class="cell res"><span class="num">${c}</span><span class="gen">${esc(reserved)}</span></div>`;
      const L = shelf.cubeLayout(records, c, { lpMm: lpMm() });
      const gs = genresLabel(L.items);
      const pct = Math.round(L.occupancy * 100);
      const nd = L.items.filter(i => done.has(i.record.barcode)).length;
      const all = L.count > 0 && nd === L.count;
      return `<div class="cell${String(c)===String(cube)?" on":""}${all?" alldone":""}" data-c="${c}">
        <span class="num">${c}</span>
        ${L.count ? `<span class="pin">${pct}%</span>` : ""}
        <span class="gen">${esc(gs) || "-"}</span>
        ${nd ? `<span class="done">${all ? "done" : nd + "/" + L.count}</span>` : ""}
        <span class="bar" style="width:${Math.min(100,pct)}%"></span></div>`;
    }).join("");
    return `<div class="shelf"><div class="cap">${esc(sh.name)}</div>
      <div class="grid" style="grid-template-columns:repeat(${cols},auto)">${cells}</div></div>`;
  };

  const elseBlock = e => {
    // The turntable and the overflow pile are not on the wall, but they ARE places
    // records live, so each is drawn as its own piece of furniture: the name sits over
    // the block exactly as "Shelf 1" does, and the cell inside carries the same facts
    // as any cube cell. Previously the name sat INSIDE the cell in cube-number style
    // and the block had no caption, so these two read as a different kind of object
    // than the shelves they sit beside.
    const L = shelf.cubeLayout(records, e.cube, { lpMm: lpMm() });
    const gs = genresLabel(L.items);
    const nd = L.items.filter(i => done.has(i.record.barcode)).length;
    const all = L.count > 0 && nd === L.count;
    // Overflow has no measured width on purpose, so it gets no percentage and no fill
    // bar: a fullness figure would imply it is a place where things fit. The count in
    // the top slot is labelled "discs" so it cannot be misread as a cube number, the
    // one thing that slot means everywhere else on this map.
    const pct = L.innerMm ? Math.round(L.occupancy * 100) : null;
    return `<div class="shelf"><div class="cap">${esc(e.label)}</div>
      <div class="grid" style="grid-template-columns:repeat(1,auto)">
        <div class="cell${e.cube===shelf.OVERFLOW?" ovf":""}${String(e.cube)===String(cube)?" on":""}${all?" alldone":""}" data-c="${e.cube}">
          <span class="num">${L.count} <i>discs</i></span>
          ${pct !== null && L.count ? `<span class="pin">${pct}%</span>` : ""}
          <span class="gen">${esc(gs) || "-"}</span>
          ${nd ? `<span class="done">${all ? "done" : nd + "/" + L.count}</span>` : ""}
          ${pct !== null ? `<span class="bar" style="width:${Math.min(100,pct)}%"></span>` : ""}
        </div></div></div>`;
  };

  // The drawing mirrors the room: the tall standing unit on the left, the wide low unit
  // beside it. The low unit leaves real space beneath it, and the turntable and the
  // overflow pile go there. That is a decision about the DRAWING and not a claim about
  // the house, because neither of them is on the wall at all.
  //
  // Written against the shape of WALL rather than against two known shelves, so a third
  // unit joins the stack instead of sending someone back here to lay it out again.
  const [tall, ...rest] = shelf.WALL;
  el("wall").innerHTML = shelfBlock(tall) +
    `<div class="stack">${rest.map(shelfBlock).join("")}` +
    `<div class="pair">${shelf.ELSEWHERE.map(elseBlock).join("")}</div></div>`;

  el("wall").querySelectorAll(".cell[data-c]").forEach(d =>
    d.onclick = () => { cube = d.dataset.c; hitBarcode = null; draw(); });

  // The spine view below draws ONE cube, but it belongs to the same object as this map,
  // so it takes the map's exact span: Shelf 1's left edge to Shelf 2's right edge.
  //
  // MEASURED, never written down. That width is a consequence of how many cubes each
  // unit carries (229 + 34 + 447 today), so a literal would be silently wrong the first
  // time a shelf changed, and the two drawings would drift apart with nothing saying so.
  // Reading the union of the blocks also survives the flex wrapping on a narrow screen,
  // where the answer becomes the widest row instead.
  const boxes = [...el("wall").children].map(c => c.getBoundingClientRect());
  if (boxes.length) {
    const span = Math.round(Math.max(...boxes.map(b => b.right))
                          - Math.min(...boxes.map(b => b.left)));
    // box-sizing is border-box globally, so this includes the cube's own 2px frame and
    // the edges land on the same pixels as the shelves.
    el("cube").style.width = `${span}px`;
    el("ruler").style.width = `${span}px`;
  }
}

// ---- the selected cube ------------------------------------------------------
function draw() {
  if (cube === null) cube = shelf.cubeList(records)[0];
  drawWall();
  const L = shelf.cubeLayout(records, cube, { lpMm: lpMm() });
  const pct = v => (v / L.innerMm) * 100;
  el("cube").innerHTML = L.items.map(i => {
    const lab = `${i.record.artist || "?"} - ${i.record.title || ""}`;
    return `<div class="spine${i.record.barcode===hitBarcode?" hit":""}"
      style="flex:0 0 ${pct(i.widthMm)}%" data-b="${esc(i.record.barcode)}"
      title="${esc(lab)} · ${Math.round(i.centerMm)}mm"><span class="lab">${esc(lab)}</span></div>`;
  }).join("") + (L.occupancy < 0.995 ? `<div class="empty"></div>` : "");
  el("cube").querySelectorAll(".spine").forEach(s =>
    s.onclick = () => { hitBarcode = s.dataset.b; draw(); });

  el("rmid").textContent = `${Math.round(L.occupiedMm)} mm used`;
  el("rmax").textContent = `${L.innerMm} mm`;
  const gs = genresOf(L.items).join(", ");
  const where = shelf.locationLabel(cube);
  el("meta").innerHTML = `<b>${where}</b> · ${esc(gs) || "empty"} · <b>${L.count}</b> discs · ` +
    (L.innerMm
      ? `<b>${Math.round(L.occupiedMm)} mm</b> of ${L.innerMm} · <b>${(L.occupancy*100).toFixed(0)}%</b>`
        + (L.overfull ? ` · <span class="warn">over ${L.innerMm} mm</span>` : "")
      : `<b>${Math.round(L.occupiedMm)} mm</b> of spine, no fixed width`);
  drawEnds(L); drawDetail(); drawOrder(L);
}

function opts(L, sel) {
  return [`<option value="">- not set -</option>`].concat(L.items.map(i =>
    `<option value="${esc(i.record.barcode)}"${i.record.barcode===sel?" selected":""}>` +
    `${i.index+1}. ${esc(i.record.artist||"?")} - ${esc(i.record.title||"")}</option>`)).join("");
}
function drawEnds(L) {
  const a = shelf.anchorsFor(records, cube);
  el("first").innerHTML = opts(L, a.first?.barcode);
  el("last").innerHTML = opts(L, a.last?.barcode);
  const rec = shelf.reconcile(records, cube);
  if (!rec.ready) {
    el("recmsg").innerHTML = `Set both ends and this cube stops being a guess. The ` +
      `<code>cube</code> field is derived, not observed; the two ends are the only facts ` +
      `actually seen on the shelf, and any disagreement between them becomes a list of discs to check.`;
  } else if (rec.agrees) {
    el("recmsg").innerHTML = `<b>Ends agree.</b> Everything alphabetically between ` +
      `<b>${esc(rec.first.artist)}</b> and <b>${esc(rec.last.artist)}</b> is here, and nothing else is.`;
  } else {
    const list = rs => rs.map(r => `<li>${esc(r.artist||"?")} - ${esc(r.title||"")} <span class="lbl">(cube ${esc(r.cube??"-")})</span></li>`).join("");
    el("recmsg").innerHTML = `<b class="warn">Ends disagree with the tags.</b> Between ` +
      `<b>${esc(rec.first.artist)}</b> and <b>${esc(rec.last.artist)}</b> the shelf should hold ` +
      `<b>${rec.expected}</b>; <b>${rec.tagged}</b> are tagged here.` +
      (rec.shouldBeHere.length?`<div style="margin-top:7px">In the interval, tagged elsewhere:<ul>${list(rec.shouldBeHere)}</ul></div>`:"") +
      (rec.shouldNotBeHere.length?`<div style="margin-top:7px">Tagged here, outside the interval:<ul>${list(rec.shouldNotBeHere)}</ul></div>`:"");
  }
}
function drawDetail() {
  const r = records.find(x => x.barcode === hitBarcode);
  el("detailpanel").hidden = !r; if (!r) return;
  const loc = shelf.locate(records, r, { lpMm: lpMm() });
  el("detailtitle").textContent = `${r.artist || "?"} - ${r.title || ""}`;
  el("detail").innerHTML = [
    ["cube", r.cube ?? "-"],
    ["position", loc ? `${loc.positionMm} mm from the left · ${loc.fromRightMm} mm from the end of the run` : "-"],
    ["order", loc ? `${loc.index} of ${loc.of}` : "-"],
    ["format", `${r.format || "-"} · ${shelf.thicknessMm(r, lpMm()).toFixed(1)} mm`],
    ["genre", r.genre || "-"], ["year", r.year || "-"], ["barcode", r.barcode],
  ].map(([k,v]) => `<tr><td class="k">${k}</td><td>${esc(v)}</td></tr>`).join("");
}
// this is what wall.html used to be, now folded in per cube
function drawOrder(L) {
  const inOverflow = String(cube) === shelf.OVERFLOW;
  el("ordtitle").textContent = inOverflow ? "Overflow, alphabetical"
    : `${shelf.locationLabel(cube)} in order, left to right`;
  const n = L.items.filter(i => done.has(i.record.barcode)).length;
  el("prog").innerHTML = L.count ? `<b>${n}</b> of ${L.count} done` : "";
  el("ord").innerHTML = L.items.map(i => {
    const d = done.has(i.record.barcode);
    return `<tr class="${i.record.barcode===hitBarcode?"hit ":""}${d?"done":""}">` +
      `<td class="ck"><input type="checkbox" data-b="${esc(i.record.barcode)}"${d?" checked":""}></td>` +
      `<td class="i">${i.index+1}</td><td class="mm">${Math.round(i.startMm)}</td>` +
      `<td class="a">${esc(i.record.artist||"?")}</td>` +
      `<td class="t">${esc(i.record.title||"")}</td><td class="g">${esc(i.record.format||"")}</td>` +
      `<td class="mv"><button data-mv="${esc(i.record.barcode)}">${inOverflow ? "shelve" : "overflow"}</button></td></tr>`;
  }).join("") || `<tr><td class="t">empty</td></tr>`;
  el("ord").querySelectorAll("button[data-mv]").forEach(b => b.onclick = () => move(b.dataset.mv));
  // Redraw only what changed: re-rendering the whole page on every tick would scroll you
  // back to the top, which is useless when you are twenty rows down a cube.
  el("ord").querySelectorAll("input[data-b]").forEach(cb => cb.onchange = () => {
    cb.checked ? done.add(cb.dataset.b) : done.delete(cb.dataset.b);
    saveDone();
    cb.closest("tr").classList.toggle("done", cb.checked);
    const m = L.items.filter(i => done.has(i.record.barcode)).length;
    el("prog").innerHTML = `<b>${m}</b> of ${L.count} done`;
    drawWall();
  });
}

el("q").oninput = () => {
  const q = el("q").value.trim();
  if (!q) { el("found").innerHTML=""; el("count").textContent=""; return; }
  const hits = records.filter(r => matchesQuery(r, q)).slice(0, 6);
  el("count").textContent = `${hits.length} shown`;
  el("found").innerHTML = hits.map(r => {
    const loc = shelf.locate(records, r, { lpMm: lpMm() });
    const where = loc ? `<span class="where">cube ${loc.cube} · ${loc.positionMm} mm from the left · ${loc.index} of ${loc.of}</span>`
                      : `<span class="lbl">no cube recorded</span>`;
    return `<div><a href="#" data-b="${esc(r.barcode)}" data-c="${esc(r.cube??"")}">${esc(r.artist||"?")} - ${esc(r.title||"")}</a> · ${where}</div>`;
  }).join("");
  el("found").querySelectorAll("a").forEach(a => a.onclick = ev => {
    ev.preventDefault();
    if (a.dataset.c) cube = a.dataset.c;
    hitBarcode = a.dataset.b; draw();
  });
};
// Moving to overflow is a write to the collection, unlike a tick. Coming back, the
// record returns to wherever its genre now says it belongs rather than where it was,
// because the wall may have changed while it sat in the pile.
async function move(barcode, to) {
  const r = records.find(x => x.barcode === barcode);
  if (!r) return;
  const out = String(r.cube) !== shelf.OVERFLOW;
  let dest = to;
  if (!dest) {
    if (out) dest = shelf.OVERFLOW;
    else {
      const cubes = shelf.cubeList(records).filter(c => /^\d+$/.test(c));
      const same = records.filter(x => x.genre === r.genre && /^\d+$/.test(String(x.cube)));
      dest = same.length ? String(Math.min(...same.map(x => +x.cube))) : (cubes[0] || "1");
      if (!confirm(`Shelve "${r.artist} - ${r.title}" back into cube ${dest}?`)) return;
    }
  }
  const next = shelf.setLocation(records, barcode, dest);
  try { await saveRecords(next); records = next; hitBarcode = null; draw(); }
  catch (e) { alert(`not saved: ${e.message}`); }
}

el("bulkovf").onclick = async () => {
  const L = shelf.cubeLayout(records, cube, { lpMm: lpMm() });
  const un = L.items.filter(i => !done.has(i.record.barcode)).map(i => i.record);
  if (!un.length) { alert("everything here is ticked"); return; }
  const names = un.slice(0, 12).map(r => `  ${r.artist} - ${r.title}`).join("\n");
  if (!confirm(`Move ${un.length} UNTICKED record(s) out of cube ${cube} into overflow?\n\n`
    + names + (un.length > 12 ? `\n  ... and ${un.length - 12} more` : ""))) return;
  let next = records;
  for (const r of un) next = shelf.setLocation(next, r.barcode, shelf.OVERFLOW);
  try { await saveRecords(next); records = next; draw(); }
  catch (e) { alert(`not saved: ${e.message}`); }
};

el("clr").onclick = () => {
  const L = shelf.cubeLayout(records, cube, { lpMm: lpMm() });
  const n = L.items.filter(i => done.has(i.record.barcode)).length;
  if (!n) return;
  if (!confirm(`Clear ${n} tick(s) on cube ${cube}?`)) return;
  for (const i of L.items) done.delete(i.record.barcode);
  saveDone(); draw();
};
el("lpmm").oninput = draw;
el("save").onclick = async () => {
  let next = records;
  next = shelf.setAnchor(next, cube, "first", el("first").value || null);
  next = shelf.setAnchor(next, cube, "last", el("last").value || null);
  el("savemsg").textContent = "saving…";
  try { await saveRecords(next); records = next; el("savemsg").textContent = "saved"; draw(); }
  catch (e) { el("savemsg").textContent = `not saved: ${e.message}`; }
};
draw();
</script>
</body>
</html>
