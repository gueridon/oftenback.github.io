<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vinyl Collection — Editor</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<link rel="stylesheet" href="style.css">
<script type="module" src="sync.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>

<body>

<h1>Vinyl Collection — Editor</h1>

<nav>
  <a href="index.html">Editor</a>
  <a href="view.html">Viewer</a>
  <a href="stats.html">Statistics</a>
  <a href="print-barcodes.html">Print Barcodes</a>
</nav>

<!-- SYNC STATUS BADGE -->
<div style="margin-bottom:16px;">
  <span id="syncStatus" class="sync-status sync-none">Sync: Unknown</span>
</div>

<div class="card">

  <!-- =============== FORM ================ -->
  <form id="recordForm" class="form-row">

  <div class="form-block">
    <label>Artist</label>
    <input id="artist" list="artistList" required autocomplete="off" />
    <datalist id="artistList"></datalist>
  </div>

  <div class="form-block">
    <label>Title</label>
    <input id="title" required />
  </div>

  <div class="form-block narrow">
    <label>Year</label>
    <input id="year" type="number" min="1800" max="2100"/>
  </div>

  <div class="form-block">
    <label>Genre</label>
    <input id="genre" list="genreList"/>
    <datalist id="genreList"></datalist>
  </div>

  <div class="form-block">
    <label>Format</label>
    <input id="format" list="formatList"/>
    <datalist id="formatList"></datalist>
  </div>

  <div class="form-block">
    <label>Barcode</label>
    <input id="barcode" readonly style="background:#f0f0f0;"/>
  </div>

  <div class="form-actions">
    <button class="primary" type="submit">Add / Update</button>
    <button id="exportBtn" type="button">Export JSON</button>
    <button id="importBtn" type="button">Import JSON</button>
  </div>

</form>


  <!-- =============== REMOTE CONTROLS ================ -->
  <div style="margin-top:20px; display:flex; gap:10px; align-items:center;">
    <button id="pullBtn" class="orange small">Pull Data</button>
    <button id="pushBtn" class="primary small">Push Data</button>
  </div>

  <!-- GitHub settings -->
  <div style="margin-top:20px; display:flex; gap:12px; flex-wrap:wrap;">
    <input id="owner" placeholder="GitHub owner"/>
    <input id="repo" placeholder="Repo name"/>
    <input id="token" placeholder="Access token" style="width:280px;"/>
    <button id="saveTokenBtn" class="ghost small">Save</button>
  </div>

  <!-- =============== TABLE ================ -->
  <div class="table-wrap" style="margin-top:18px;">
    <table id="recordTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Artist</th>
          <th>Title</th>
          <th>Year</th>
          <th>Genre</th>
          <th>Format</th>
          <th>Barcode</th>
          <th style="min-width:120px">Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script type="module">
// =========================
// INDEX.JS LOGIC START
// =========================

import { githubGetFile, githubCreateOrUpdateFile } from './sync.js';

const LS_KEY = 'vinyl_records_v1';
const LS_TOKEN = 'vinyl_token';
const LS_OWNER = 'vinyl_owner';
const LS_REPO = 'vinyl_repo';
const REMOTE_FILE = 'vinyl.json';

let records = [];
let remoteCache = null;

const syncBadge = document.getElementById("syncStatus");

function setBadge(state, text) {
  syncBadge.textContent = text;
  syncBadge.className = "sync-status " + state;
}

/* -----------------------------------------
   LOAD SETTINGS
----------------------------------------- */
owner.value = localStorage.getItem(LS_OWNER) || "";
repo.value = localStorage.getItem(LS_REPO) || "";
token.value = localStorage.getItem(LS_TOKEN) || "";

saveTokenBtn.onclick = () => {
  localStorage.setItem(LS_OWNER, owner.value);
  localStorage.setItem(LS_REPO, repo.value);
  localStorage.setItem(LS_TOKEN, token.value);
  alert("Saved GitHub settings.");
};

/* -----------------------------------------
   LOCAL LOADING
----------------------------------------- */
function loadLocal() {
  try {
    records = JSON.parse(localStorage.getItem(LS_KEY)) || [];
  } catch { records = []; }
  sortRecords();
  updateDatalists();
  renderTable();
}

function saveLocal() {
  localStorage.setItem(LS_KEY, JSON.stringify(records, null, 2));
}

/* -----------------------------------------
   BARCODE GENERATION
----------------------------------------- */
function generateBarcode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = 'VNL-';
  for (let i = 0; i < 6; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}

function generateUniqueBarcode() {
  let barcode;
  do {
    barcode = generateBarcode();
  } while (records.some(r => r.barcode === barcode));
  return barcode;
}

/* -----------------------------------------
   BASIC HELPERS
----------------------------------------- */
function sortRecords() {
  records.sort((a,b) => a.artist.localeCompare(b.artist));
}

function updateDatalist(records, field, el) {
  const set = new Set(records.map(r => r[field]).filter(Boolean));
  el.innerHTML = "";
  [...set].sort().forEach(v => {
    const o = document.createElement("option");
    o.value = v;
    el.appendChild(o);
  });
}

function updateDatalists() {
  updateDatalist(records, 'artist', artistList);
  updateDatalist(records, 'genre', genreList);
  updateDatalist(records, 'format', formatList);
}

function renderTable() {
  const tbody = document.querySelector("#recordTable tbody");
  tbody.innerHTML = "";
  records.forEach((r, i) => {
    const tr = document.createElement("tr");

    // Create QR code cell
    const qrCell = document.createElement("td");
    qrCell.style.textAlign = "center";
    const qrDiv = document.createElement("div");
    qrDiv.style.display = "inline-block";
    qrDiv.className = "qr-code-" + i;
    qrCell.appendChild(qrDiv);

    const barcodeText = document.createElement("div");
    barcodeText.textContent = r.barcode || "N/A";
    barcodeText.style.fontSize = "10px";
    barcodeText.style.marginTop = "4px";
    qrCell.appendChild(barcodeText);

    tr.innerHTML = `
      <td>${i+1}</td>
      <td>${r.artist}</td>
      <td>${r.title}</td>
      <td>${r.year||""}</td>
      <td>${r.genre||""}</td>
      <td>${r.format||""}</td>`;

    tr.appendChild(qrCell);

    tr.innerHTML += `
      <td>
        <button class="orange small" data-i="${i}" data-action="edit">Edit</button>
        <button class="red small" data-i="${i}" data-action="delete">Delete</button>
      </td>`;
    tbody.appendChild(tr);

    // Generate QR code after DOM is ready
    if (r.barcode) {
      setTimeout(() => {
        new QRCode(qrDiv, {
          text: r.barcode,
          width: 64,
          height: 64
        });
      }, 10);
    }
  });

  document.querySelectorAll("[data-action='edit']").forEach(btn =>
    btn.onclick = () => {
      const r = records[btn.dataset.i];
      artist.value = r.artist;
      title.value = r.title;
      year.value = r.year;
      genre.value = r.genre;
      format.value = r.format;
      barcode.value = r.barcode || "";
      records.splice(btn.dataset.i, 1);
      renderTable();
    }
  );

  document.querySelectorAll("[data-action='delete']").forEach(btn =>
    btn.onclick = () => {
      if (!confirm("Delete record?")) return;
      records.splice(btn.dataset.i, 1);
      saveLocal();
      renderTable();
      updateDatalists();
      checkRemoteStatus(); // refresh badge
    }
  );
}

/* -----------------------------------------
   ADD / UPDATE RECORD
----------------------------------------- */
recordForm.onsubmit = e => {
  e.preventDefault();

  // Generate barcode if not present (new record) or keep existing
  const barcodeValue = barcode.value.trim() || generateUniqueBarcode();

  const newRecord = {
    artist: artist.value.trim(),
    title: title.value.trim(),
    year: year.value.trim(),
    genre: genre.value.trim(),
    format: format.value.trim(),
    barcode: barcodeValue
  };

  const i = records.findIndex(r =>
    r.artist.toLowerCase() === newRecord.artist.toLowerCase() &&
    r.title.toLowerCase() === newRecord.title.toLowerCase()
  );

  if (i >= 0) records[i] = newRecord;
  else records.push(newRecord);

  sortRecords();
  updateDatalists();
  saveLocal();
  renderTable();
  recordForm.reset();
  checkRemoteStatus(); // badge
};

/* -----------------------------------------
   EXPORT JSON
----------------------------------------- */
exportBtn.onclick = () => {
  const blob = new Blob([JSON.stringify(records, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "vinyl-export.json";
  a.click();
};

/* -----------------------------------------
   IMPORT JSON (merge)
----------------------------------------- */
importBtn.onclick = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";

  input.onchange = async () => {
    const text = await input.files[0].text();
    try {
      const imported = JSON.parse(text);
      records = mergeRecords(records, imported);
      saveLocal();
      updateDatalists();
      renderTable();
      checkRemoteStatus();
    } catch (e) {
      alert("Import failed: " + e.message);
    }
  };

  input.click();
};

/* ============ MERGING LOGIC (used for Pull + Import) ============ */
function mergeRecords(local, remote) {
  const map = new Map();
  const key = r => r.artist.toLowerCase()+"||"+r.title.toLowerCase();

  local.forEach(r => map.set(key(r), {...r}));

  remote.forEach(r => {
    const k = key(r);
    if (!map.has(k)) map.set(k, {...r});
    else {
      const o = map.get(k);
      ['year','genre','format'].forEach(f=>{
        if (!o[f] && r[f]) o[f]=r[f];
      });
    }
  });

  return [...map.values()];
}

/* -----------------------------------------
   REMOTE CHECK
----------------------------------------- */
async function checkRemoteStatus() {
  const o = owner.value.trim();
  const r = repo.value.trim();
  const t = token.value.trim();

  if (!o || !r || !t) {
    setBadge("sync-none","Remote: Not configured");
    return;
  }

  try {
    const remote = await githubGetFile(o, r, REMOTE_FILE, t);
    if (!remote) {
      setBadge("sync-none", "Remote: None");
      return;
    }

    remoteCache = remote.content;

    const remoteCount = remote.content.length;
    const localCount = records.length;

    if (localCount === remoteCount) {
      setBadge("sync-ok", "Up to Date");
    } else if (localCount > remoteCount) {
      setBadge("sync-ahead", "Local Ahead");
    } else if (remoteCount > localCount) {
      setBadge("sync-remote", "Remote Ahead");
    } else {
      setBadge("sync-diverged", "Diverged");
    }

  } catch (e) {
    setBadge("sync-none", "Remote: Error");
  }
}

/* -----------------------------------------
   PULL: remote → merge → local
----------------------------------------- */
pullBtn.onclick = async () => {
  const o = owner.value.trim();
  const r = repo.value.trim();
  const t = token.value.trim();
  if (!o || !r || !t) return alert("Enter GitHub settings.");

  try {
    const remote = await githubGetFile(o, r, REMOTE_FILE, t);
    if (!remote) return alert("No remote file found.");

    records = mergeRecords(records, remote.content);
    saveLocal();
    updateDatalists();
    renderTable();
    setBadge("sync-ok","Up to Date");
  } catch (e) {
    alert("Pull failed: " + e.message);
  }
};

/* -----------------------------------------
   PUSH: local → overwrite → remote
----------------------------------------- */
pushBtn.onclick = async () => {
  const o = owner.value.trim();
  const r = repo.value.trim();
  const t = token.value.trim();
  if (!o || !r || !t) return alert("Enter GitHub settings.");

  try {
    await githubCreateOrUpdateFile(
      o, r, REMOTE_FILE, t,
      JSON.stringify(records,null,2),
      `Overwrite remote from UI: ${new Date().toISOString()}`
    );
    setBadge("sync-ok","Up to Date");
    alert("Pushed successfully.");
  } catch (e) {
    alert("Push failed: " + e.message);
  }
};

/* -----------------------------------------
   AUTO CHECK EVERY 30 SECONDS
----------------------------------------- */
setInterval(checkRemoteStatus, 30000);

/* initial load */
loadLocal();
checkRemoteStatus();

</script>

</body>
</html>
