<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Load Vinyl Data</title>
<link rel="stylesheet" href="style.css">
<style>
  .instructions {
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
  }
  .button-large {
    font-size: 18px;
    padding: 15px 30px;
    margin: 20px 0;
  }
  .status {
    margin-top: 20px;
    padding: 15px;
    border-radius: 5px;
  }
  .success { background: #d4edda; color: #155724; }
  .error { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>

<div class="card instructions">
  <h1>Load Vinyl Collection Data</h1>

  <p>This page will load your vinyl collection data (with barcodes) into the browser.</p>

  <input type="file" id="fileInput" accept=".json" style="display:none">
  <button id="loadBtn" class="primary button-large">Choose vinyl.json File</button>

  <div id="status"></div>

  <div style="margin-top: 30px; padding: 15px; background: #f8f9fa; border-radius: 5px;">
    <strong>File location:</strong><br>
    <code>/home/nbacuez/gueridon/vinyl-collection-data/vinyl.json</code>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const loadBtn = document.getElementById('loadBtn');
const statusEl = document.getElementById('status');

loadBtn.onclick = () => fileInput.click();

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  try {
    statusEl.innerHTML = '<div class="status">Loading...</div>';

    const text = await file.text();
    const records = JSON.parse(text);

    // Validate data
    if (!Array.isArray(records)) {
      throw new Error('Invalid data format - not an array');
    }

    const withBarcodes = records.filter(r => r.barcode).length;

    // Save to localStorage
    localStorage.setItem('vinyl_records_v1', JSON.stringify(records, null, 2));

    statusEl.innerHTML = `
      <div class="status success">
        <h3>✓ Success!</h3>
        <p><strong>${records.length}</strong> records loaded</p>
        <p><strong>${withBarcodes}</strong> records have barcodes</p>
        <p style="margin-top: 15px;">
          <a href="index.html" style="font-size: 16px; font-weight: bold;">→ Go to Editor</a> |
          <a href="view.html" style="font-size: 16px; font-weight: bold;">→ Go to Viewer</a> |
          <a href="print-barcodes.html" style="font-size: 16px; font-weight: bold;">→ Print Barcodes</a>
        </p>
      </div>
    `;

  } catch (err) {
    statusEl.innerHTML = `
      <div class="status error">
        <h3>✗ Error</h3>
        <p>${err.message}</p>
      </div>
    `;
  }
});
</script>

</body>
</html>
