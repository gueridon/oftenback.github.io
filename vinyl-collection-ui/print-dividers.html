<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Collection - dividers</title>
<link rel="stylesheet" href="./nakata.css?v=5" />
<style>
  .divider-sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:8mm;padding:8mm 0;}
  .divider{border:1px dashed var(--separator);padding:14mm 8mm 6mm;height:90mm;
    page-break-inside:avoid;display:flex;flex-direction:column;align-items:center;text-align:center;
    background:var(--surface-light);border-radius:var(--radius);}
  .divider .glyph{font-size:56pt;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--ink);}
  .divider .sub{margin-top:8mm;font-size:10pt;color:var(--muted);}
  @media print{
    .band,.masthead nav,.rule,.controls,.no-print{display:none !important;}
    .divider-sheet{padding:0;gap:4mm;} .divider{border-color:#bbb;background:#fff;}
    .divider .glyph{color:#000;}
  }
</style>
<script src="/oftenback-nav.js" defer></script>
</head>
<body>
  <div class="wrap">
    <div id="shell"></div>
    <div class="controls no-print">
      <span class="lbl">group</span>
      <select id="mode">
        <option value="genre">by genre</option>
        <option value="letter">by artist letter</option>
        <option value="decade">by decade</option>
      </select>
      <button id="printBtn" type="button" class="primary">print</button>
      <span class="count" id="count"></span>
    </div>
    <div id="sheet" class="divider-sheet"></div>
  </div>

<script type="module">
import { renderShell, setTag } from "./js/shell.js?v=4";
import { loadRecords } from "./js/data.js";
renderShell("print-dividers.html");
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const sheet=document.getElementById("sheet"), mode=document.getElementById("mode"), countEl=document.getElementById("count");
let records=[];
const decadeOf=r=>{const y=r.year;return (!y||!/^\d{4}$/.test(y))?null:`${Math.floor(parseInt(y,10)/10)*10}s`;};
const firstLetterOf=r=>{const m=(r.artist||"").match(/[A-Za-z0-9]/);return m?m[0].toUpperCase():null;};
function buckets(){
  const m=new Map();
  const fn=mode.value==="genre"?r=>r.genre:mode.value==="letter"?firstLetterOf:decadeOf;
  for(const r of records){const k=fn(r);if(!k)continue;m.set(k,(m.get(k)||0)+1);}
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));
}
function render(){
  const b=buckets();countEl.textContent=`${b.length} dividers`;
  sheet.innerHTML=b.map(([l,n])=>`<div class="divider"><div class="glyph">${esc(l)}</div>
    <div class="sub">${n} record${n===1?"":"s"}</div></div>`).join("");
}
mode.addEventListener("change",render);
document.getElementById("printBtn").addEventListener("click",()=>window.print());
try{records=await loadRecords();setTag(`${records.length} records`);render();}
catch(err){sheet.innerHTML=`<div class="banner err">${err.message}</div>`;}
</script>
</body>
</html>
