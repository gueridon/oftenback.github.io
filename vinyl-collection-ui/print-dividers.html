<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vinyl Collection — Print Dividers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<style>
  @media print {
    nav, .no-print { display: none !important; }
    body { background: white; margin: 0; }
  }

  .divider-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 12px;
    padding: 20px;
  }

  .divider-card {
    border: 2px solid var(--color-2);
    height: 104px;
    display: flex;
    flex-direction: column;
    break-inside: avoid;
    page-break-inside: avoid;
    background: white;
  }

  .divider-half {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .divider-half:first-child {
    border-bottom: 2px dashed #999;
  }

  .divider-text {
    font-weight: 700;
    font-size: 16px;
    color: var(--color-5);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 12px;
  }
</style>
</head>

<body>

<h1 class="no-print">Vinyl Collection — Print Dividers</h1>

<nav class="no-print">
  <a href="index.html">Editor</a>
  <a href="view.html">Viewer</a>
  <a href="stats.html">Statistics</a>
  <a href="print-barcodes.html">Print Barcodes</a>
  <a href="print-dividers.html">Print Dividers</a>
</nav>

<div class="card no-print">
  <div style="display:flex; gap:12px; align-items:center; margin-bottom:16px; flex-wrap:wrap;">
    <button id="printBtn" class="primary">Print Dividers</button>
  </div>
  <div style="color:#555; font-size:14px;">
    <span id="artistCount">0</span> artist dividers (2+ records)
  </div>
</div>

<div class="divider-grid" id="dividerGrid"></div>

<script>
const LS_KEY = "vinyl_records_v1";
let allRecords = [];

const dividerGrid = document.getElementById("dividerGrid");
const printBtn = document.getElementById("printBtn");
const artistCountEl = document.getElementById("artistCount");

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    allRecords = raw ? JSON.parse(raw) : [];
  } catch { allRecords = []; }
  render();
}

function buildDividers() {
  const artistCounts = {};

  allRecords.forEach(r => {
    if (!r.artist) return;
    artistCounts[r.artist] = (artistCounts[r.artist] || 0) + 1;
  });

  return Object.entries(artistCounts)
    .filter(([, count]) => count >= 2)
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([artist, count]) => ({ text: artist, count }));
}

function render() {
  const artists = buildDividers();
  artistCountEl.textContent = artists.length;

  dividerGrid.innerHTML = "";

  artists.forEach(d => {
    const card = document.createElement("div");
    card.className = "divider-card";

    const topHalf = document.createElement("div");
    topHalf.className = "divider-half";
    const topText = document.createElement("div");
    topText.className = "divider-text";
    topText.textContent = d.text;
    topHalf.appendChild(topText);

    const bottomHalf = document.createElement("div");
    bottomHalf.className = "divider-half";
    const bottomText = document.createElement("div");
    bottomText.className = "divider-text";
    bottomText.textContent = d.text;
    bottomHalf.appendChild(bottomText);

    card.appendChild(topHalf);
    card.appendChild(bottomHalf);
    dividerGrid.appendChild(card);
  });
}

printBtn.onclick = () => window.print();

loadLocal();
</script>

</body>
</html>
