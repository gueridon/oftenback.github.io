<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>vinyl — print dividers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    .divider-sheet {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8mm;
      padding: 8mm;
      background: white;
    }
    .divider {
      border: 1px dashed #bbb;
      padding: 14mm 8mm 6mm;
      height: 90mm;
      page-break-inside: avoid;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
    }
    .divider .glyph {
      font-size: 56pt;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .divider .sub {
      margin-top: 8mm;
      font-size: 10pt;
      color: var(--muted);
    }
    @media print {
      .controls, .topbar, .footer, .banner, .no-print { display: none !important; }
      .divider-sheet { padding: 0; gap: 4mm; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="controls no-print">
      <label for="mode">mode:</label>
      <select id="mode">
        <option value="genre">by genre</option>
        <option value="letter">by first letter of artist</option>
        <option value="decade">by decade</option>
      </select>
      <button id="printBtn" type="button" class="primary">print</button>
      <span id="count" style="color: var(--muted); font-size: 13px;"></span>
    </div>

    <div id="sheet" class="divider-sheet"></div>
  </main>

  <script type="module">
    import { renderShell } from "./js/shell.js";
    import { loadRecords } from "./js/data.js";

    renderShell("print-dividers.html");

    const sheet = document.getElementById("sheet");
    const mode = document.getElementById("mode");
    const countEl = document.getElementById("count");

    let records = [];

    function escape(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function decadeOf(r) {
      const y = r.year;
      if (!y || !/^\d{4}$/.test(y)) return null;
      return `${Math.floor(parseInt(y, 10) / 10) * 10}s`;
    }
    function firstLetterOf(r) {
      const m = (r.artist || "").match(/[A-Za-z0-9]/);
      return m ? m[0].toUpperCase() : null;
    }

    function bucketCounts() {
      const m = new Map();
      const fn = mode.value === "genre" ? r => r.genre
              : mode.value === "letter" ? firstLetterOf
              : decadeOf;
      for (const r of records) {
        const k = fn(r);
        if (!k) continue;
        m.set(k, (m.get(k) || 0) + 1);
      }
      return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));
    }

    function render() {
      const buckets = bucketCounts();
      countEl.textContent = `${buckets.length} dividers`;
      sheet.innerHTML = buckets.map(([label, n]) => `
        <div class="divider">
          <div class="glyph">${escape(label)}</div>
          <div class="sub">${n} record${n === 1 ? "" : "s"}</div>
        </div>
      `).join("");
    }

    mode.addEventListener("change", render);
    document.getElementById("printBtn").addEventListener("click", () => window.print());

    try {
      records = await loadRecords();
      render();
    } catch (err) {
      sheet.innerHTML = `<div class="banner err">${err.message}</div>`;
    }
  </script>
</body>
</html>
