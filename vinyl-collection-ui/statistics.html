<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vinyl Collection — Statistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Chart.js -->
<script src="https://unpkg.com/chart.js@4.4.0/dist/chart.umd.js"></script>

<!-- DataLabels plugin -->
<script src="https://unpkg.com/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.js"></script>

<!-- Treemap plugin (UMD build, correct MIME, works in WebKit) -->
<script src="https://unpkg.com/chartjs-chart-treemap@2.0.3/dist/chartjs-chart-treemap.umd.js"></script>

<!-- Matrix (Heatmap) plugin (UMD build, correct MIME, works in WebKit) -->
<script src="https://unpkg.com/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.umd.js"></script>
<script>
  Chart.register(ChartDataLabels);
  Chart.register(Chart.TreemapController, Chart.TreemapElement);
  Chart.register(Chart.MatrixController, Chart.MatrixElement);
</script>

<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --border: #e5e7eb;
    --muted: #6b7280;
    --accent: #0ea5e9;
    --radius: 12px;
  }

  body {
    margin: 20px;
    background: var(--bg);
    color: #111827;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";
  }

  h1 {
    margin-bottom: 6px;
  }
  .nav {
    margin-bottom: 18px;
  }
  .nav a {
    margin-right: 14px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .summary-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .card h3 {
    margin-top: 0;
    margin-bottom: 10px;
  }

  canvas {
    max-width: 100%;
  }

  .muted {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .top10 {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .top10 ul {
    margin: 0 0 12px 1.2rem;
    padding: 0;
  }
</style>
</head>
<body>

<h1>📊 Vinyl Collection — Statistics</h1>

<div class="nav">
  <a href="index.html">Editor</a>
  <a href="view.html">Viewer</a>
</div>

<div id="summaryBox" class="summary-box"></div>

<!-- First row -->
<div class="grid">
  <div class="card">
    <h3>Artists — Top 20</h3>
    <canvas id="artistBar"></canvas>
    <p id="artistNote" class="muted"></p>
  </div>

  <div class="card">
    <h3>Decades</h3>
    <canvas id="decadeBar"></canvas>
  </div>

  <div class="card">
    <h3>Years distribution (line)</h3>
    <canvas id="yearLine"></canvas>
  </div>

  <div class="card">
    <h3>Formats</h3>
    <canvas id="formatDonut"></canvas>
  </div>
</div>

<!-- Second row -->
<div class="grid">
  <div class="card">
    <h3>Genres — Treemap</h3>
    <canvas id="genreTreemap"></canvas>
  </div>

  <div class="card">
    <h3>Genre × Decade — Heatmap</h3>
    <canvas id="genreDecadeHeatmap"></canvas>
  </div>
</div>

<div class="top10">
  <h3>Top 10 Artists</h3>
  <ul id="topArtists"></ul>

  <h3>Top 10 Genres</h3>
  <ul id="topGenres"></ul>

  <h3>Top 10 Formats</h3>
  <ul id="topFormats"></ul>
</div>

<script>
/* -------------------------
   Loading & grouping helpers
   ------------------------- */
const LS_KEY = "vinyl_records_v1";
let records = [];

function loadRecords() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    records = raw ? JSON.parse(raw) : [];
  } catch {
    records = [];
  }
}

function countBy(field) {
  const m = new Map();
  records.forEach(r => {
    const v = (r[field] || "").trim();
    if (!v) return;
    m.set(v, (m.get(v) || 0) + 1);
  });
  return m;
}

function decadeOf(yearStr) {
  const y = Number(yearStr);
  if (!y) return "Unknown";
  return Math.floor(y / 10) * 10 + "s";
}

function countByDecade() {
  const map = new Map();
  records.forEach(r => {
    const d = decadeOf(r.year);
    map.set(d, (map.get(d) || 0) + 1);
  });
  return map;
}

function yearList() {
  return records
    .map(r => Number(r.year))
    .filter(y => y > 0)
    .sort((a, b) => a - b);
}

function sortedEntries(map) {
  return Array.from(map.entries()).sort((a,b) => b[1] - a[1]);
}

/* -------------------------
   Summary section
   ------------------------- */
function updateSummary() {
  const list = yearList();
  const oldest = list.length ? Math.min(...list) : "—";
  const newest = list.length ? Math.max(...list) : "—";
  const median = list.length
    ? list[Math.floor(list.length / 2)]
    : "—";

  document.getElementById("summaryBox").innerHTML = `
    <strong>Total records:</strong> ${records.length}<br>
    <strong>Unique artists:</strong> ${countBy("artist").size} |
    <strong>Unique genres:</strong> ${countBy("genre").size} |
    <strong>Unique formats:</strong> ${countBy("format").size}<br><br>
    <strong>Oldest year:</strong> ${oldest} |
    <strong>Newest year:</strong> ${newest} |
    <strong>Median year:</strong> ${median}
  `;
}

/* -------------------------
   Top 10 lists
   ------------------------- */
function fillTop10(map, id) {
  const el = document.getElementById(id);
  el.innerHTML = "";
  sortedEntries(map)
    .slice(0, 10)
    .forEach(([k,v]) => {
      const li = document.createElement("li");
      li.textContent = `${k} — ${v}`;
      el.appendChild(li);
    });
}

/* -------------------------
   CHARTS
   ------------------------- */

function createArtistBar() {
  const map = countBy("artist");
  const sorted = sortedEntries(map);
  const maxBars = 20;
  const top = sorted.slice(0, maxBars);
  const others = sorted.slice(maxBars);

  const labels = top.map(([name]) => name);
  const data = top.map(([,count]) => count);

  if (others.length) {
    const otherTotal = others.reduce((s, [,c]) => s+c, 0);
    labels.push("Other");
    data.push(otherTotal);
    document.getElementById("artistNote").textContent =
      `Top ${maxBars} artists shown + "Other". Total: ${sorted.length} artists.`;
  }

  new Chart(document.getElementById("artistBar"), {
    type: "bar",
    data: { labels, datasets: [{ data }] },
    options: {
      responsive: true,
      indexAxis: "y",
      scales: { x: { beginAtZero: true } }
    }
  });
}

function createDecadeBar() {
  const map = countByDecade();
  const entries = Array.from(map.entries())
    .filter(([d]) => d !== "Unknown")
    .sort((a,b) => parseInt(a[0]) - parseInt(b[0]));

  const labels = entries.map(([d]) => d);
  const data = entries.map(([,c]) => c);

  new Chart(document.getElementById("decadeBar"), {
    type: "bar",
    data: { labels, datasets: [{ data }] },
    options: { scales: { y: { beginAtZero: true } } }
  });
}

function createYearLine() {
  const years = yearList();
  const count = new Map();

  years.forEach(y => count.set(y, (count.get(y)||0)+1));

  const labels = Array.from(count.keys());
  const data   = labels.map(y => count.get(y));

  new Chart(document.getElementById("yearLine"), {
    type: "line",
    data: { labels, datasets: [{ data, tension: 0.25 }] },
    options: { scales: { y: { beginAtZero: true } } }
  });
}

function createFormatDonut() {
  const map = countBy("format");
  const labels = Array.from(map.keys());
  const data = labels.map(l => map.get(l));

  new Chart(document.getElementById("formatDonut"), {
    type: "doughnut",
    data: { labels, datasets: [{ data }] },
    options: { plugins: { legend: { position: "bottom" } } }
  });
}

function createGenreTreemap() {
  const map = countBy("genre");
  const tree = Array.from(map.entries()).map(([genre,value]) => ({ genre, value }));

  new Chart(document.getElementById("genreTreemap"), {
    type: "treemap",
    data: {
      datasets: [{
        tree,
        key: "value",
        groups: ["genre"],
        spacing: 1,
        borderWidth: 1,
        captions: { display: true, color: "#111", font: { size: 11 } }
      }]
    },
    options: {
      plugins: {
        tooltip: {
          callbacks: {
            label(ctx) {
              return `${ctx.raw.genre}: ${ctx.raw.value} record(s)`;
            }
          }
        }
      }
    }
  });
}

function createGenreDecadeHeatmap() {
  const genreMap = countBy("genre");
  const decadeMap = countByDecade();

  const genres = Array.from(genreMap.keys()).sort();
  const decades = Array.from(decadeMap.keys())
    .filter(d => d !== "Unknown")
    .sort((a,b) => parseInt(a)-parseInt(b));

  const key = (g,d) => g+"|||"+d;
  const combo = new Map();

  records.forEach(r => {
    const g = (r.genre || "").trim();
    if (!g) return;
    const d = decadeOf(r.year);
    if (d === "Unknown") return;
    combo.set(key(g,d), (combo.get(key(g,d))||0)+1);
  });

  const maxVal = Math.max(...combo.values(), 1);

  const data = [];
  genres.forEach((g, gy) => {
    decades.forEach((d, dx) => {
      const v = combo.get(key(g,d)) || 0;
      if (!v) return;
      data.push({ x: d, y: g, v });
    });
  });

  new Chart(document.getElementById("genreDecadeHeatmap"), {
    type: "matrix",
    data: {
      datasets: [{
        data,
        width: () => 18,
        height: () => 18,
        backgroundColor(ctx) {
          const v = ctx.raw.v;
          const alpha = 0.2 + 0.8*(v/maxVal);
          return `rgba(14,165,233,${alpha})`;
        },
        borderColor: "rgba(0,0,0,0.1)",
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        x: { type: "category", labels: decades, offset: true },
        y: { type: "category", labels: genres, offset: true }
      },
      plugins: {
        tooltip: {
          callbacks: {
            label(ctx) {
              const d = ctx.raw;
              return `${d.y} in ${d.x}: ${d.v} record(s)`;
            }
          }
        }
      }
    }
  });
}

/* -------------------------
   Boot
   ------------------------- */
loadRecords();
updateSummary();

fillTop10(countBy("artist"), "topArtists");
fillTop10(countBy("genre"), "topGenres");
fillTop10(countBy("format"), "topFormats");

createArtistBar();
createDecadeBar();
createYearLine();
createFormatDonut();
createGenreTreemap();
createGenreDecadeHeatmap();
</script>
</body>
</html>
