<!DOCTYPE html>
<html>
<head>
<title>Cover Test</title>
</head>
<body>
<h1>Cover Image Test</h1>
<p>Testing if covers are accessible...</p>

<h2>Test 1: Direct Image Load</h2>
<img src="covers/VNL-3LNG6V.jpg" width="150" alt="Test cover 1">
<img src="covers/VNL-87E85E.jpg" width="150" alt="Test cover 2">
<img src="covers/VNL-CWSTWD.jpg" width="150" alt="Test cover 3">

<h2>Test 2: Via JavaScript</h2>
<div id="jsTest"></div>

<script>
const testCovers = [
  'covers/VNL-3LNG6V.jpg',
  'covers/VNL-87E85E.jpg',
  'covers/VNL-CWSTWD.jpg'
];

const div = document.getElementById('jsTest');

testCovers.forEach(path => {
  const img = document.createElement('img');
  img.src = path;
  img.width = 150;
  img.style.margin = '10px';
  img.onerror = () => {
    console.error('Failed to load:', path);
    img.alt = 'FAILED: ' + path;
  };
  img.onload = () => {
    console.log('Loaded:', path);
  };
  div.appendChild(img);
});
</script>

</body>
</html>
