<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vinyl Collection — Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Vinyl Collection — Viewer</h1>

<nav>
  <a href="index.html">Editor</a>
  <a href="view.html">Viewer</a>
  <a href="stats.html">Statistics</a>
</nav>

<div class="card">

  <div class="top-bar" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
    <input id="search" placeholder="Search artist, title, genre, format…">
    <label>Records per page:</label>
    <select id="pageSize">
      <option>10</option><option>20</option><option>50</option><option>100</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th class="sortable" data-field="artist">Artist</th>
          <th class="sortable" data-field="title">Title</th>
          <th class="sortable" data-field="year">Year</th>
          <th class="sortable" data-field="genre">Genre</th>
          <th class="sortable" data-field="format">Format</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="pagination" style="display:flex;gap:10px;margin-top:12px;align-items:center;">
    <button id="prevBtn">Previous</button>
    <button id="nextBtn">Next</button>
    <div id="countLabel" style="margin-left:auto;color:#555;"></div>
  </div>

</div>

<script>
  const LS_KEY = "vinyl_records_v1";

  let allRecords = [];
  let filtered = [];
  let currentPage = 1;
    
  let sortField = null;
  let sortDir = 1; // 1 = asc, -1 = desc

  const tbody = document.getElementById("tbody");
  const searchEl = document.getElementById("search");
  const pageSizeEl = document.getElementById("pageSize");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const countLabel = document.getElementById("countLabel");

  // Load saved page size
  const savedSize = localStorage.getItem("vinyl_page_size");
  if (savedSize) pageSizeEl.value = savedSize;

  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) allRecords = JSON.parse(raw);
      else allRecords = [];
    } catch (e) {
      allRecords = [];
    }
    filtered = [...allRecords];
    render();
  }

  function applyFilter() {
    const q = searchEl.value.trim().toLowerCase();
    if (!q) {
      filtered = [...allRecords];
    } else {
      filtered = allRecords.filter(r =>
        (r.artist || "").toLowerCase().includes(q) ||
        (r.title || "").toLowerCase().includes(q) ||
        (r.genre || "").toLowerCase().includes(q) ||
        (r.format || "").toLowerCase().includes(q)
      );
    }
    sortFiltered();
    currentPage = 1;
    render();
  }

  function render() {
    const pageSize = parseInt(pageSizeEl.value);
    const start = (currentPage - 1) * pageSize;
    const end = start + pageSize;

    const pageRecords = filtered.slice(start, end);

    tbody.innerHTML = "";
    pageRecords.forEach((r, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${start + i + 1}</td>
        <td>${escapeHtml(r.artist)}</td>
        <td>${escapeHtml(r.title)}</td>
        <td>${escapeHtml(r.year || "")}</td>
        <td>${escapeHtml(r.genre || "")}</td>
        <td>${escapeHtml(r.format || "")}</td>
      `;
      tbody.appendChild(tr);
    });

    prevBtn.disabled = currentPage === 1;
    nextBtn.disabled = end >= filtered.length;

    countLabel.textContent = 
      `${filtered.length} record${filtered.length !== 1 ? "s" : ""}`;
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c =>
      ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])
    );
  }
    
  function sortFiltered() {
      if (!sortField) return;

      filtered.sort((a, b) => {
        const A = (a[sortField] || "").toString().toLowerCase();
        const B = (b[sortField] || "").toString().toLowerCase();

        // numeric handling for year
        if (sortField === "year") {
          return (parseInt(A) || 0) - (parseInt(B) || 0) * sortDir;
        }

        return A.localeCompare(B) * sortDir;
      });
    }


  prevBtn.onclick = () => { currentPage--; render(); };
  nextBtn.onclick = () => { currentPage++; render(); };

  searchEl.oninput = applyFilter;

  pageSizeEl.onchange = () => {
    localStorage.setItem("vinyl_page_size", pageSizeEl.value);
    currentPage = 1;
    render();
  };

  loadLocal();
  document.querySelectorAll("th.sortable").forEach(th => {
  th.addEventListener("click", () => {
    const field = th.dataset.field;

    if (sortField === field) {
      sortDir *=  -1; // toggle direction
    } else {
      sortField = field;
      sortDir = 1;
    }

    // remove indicators from all
    document.querySelectorAll("th.sortable").forEach(h => {
      h.classList.remove("asc", "desc");
    });

    th.classList.add(sortDir === 1 ? "asc" : "desc");

    sortFiltered();
    currentPage = 1;
    render();
  });
});

</script>

</body>
</html>
